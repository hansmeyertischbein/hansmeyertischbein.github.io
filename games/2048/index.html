<body>

<header class="nav">
  <div class="wrap">
    <a class="nav-name" href="/">Hans Meyer Tischbein</a>
    <ul class="nav-links">
      <li><a href="/cv/">CV</a></li>
      <li><a href="/projects/">Projects</a></li>
    </ul>
  </div>
</header>

<main>
  <div class="wrap">
    <header class="game-head">
      <p class="crumbs"><a href="/games/">Games</a></p>
      <h1>2048</h1>
      <p class="lede">Slide the tiles. Two equal tiles merge into one. Reach 2048, then keep going if you like.</p>
    </header>

    <div class="game">
      <div class="hud">
        <dl class="stats">
          <div><dt>Score</dt><dd id="score">0</dd></div>
          <div><dt>Best</dt><dd id="best">0</dd></div>
        </dl>
        <div class="controls-row">
          <button type="button" class="btn" id="undo">Undo</button>
          <button type="button" class="btn btn-primary" id="new">New game</button>
        </div>
      </div>
      <div class="board-wrap">
        <div class="g2048" id="board" role="img" aria-label="2048 board">
          <div class="g-cells" aria-hidden="true"></div>
          <div class="g-tiles" id="tiles"></div>
        </div>
        <div class="overlay" id="overlay"><div><strong id="ov-title">Game over</strong><p id="ov-text"></p><div class="controls-row"><button type="button" class="btn" id="ov-keep">Keep going</button><button type="button" class="btn btn-primary" id="ov-new">New game</button></div></div></div>
      </div>
      <p class="game-msg" id="msg" aria-live="polite"></p>
      <p class="game-help">Swipe on the board, or use the arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>. Undo takes back one move. Your game is saved if you leave.</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">Oslo, Norway</div>
</footer>

<script src="/games/games.js?v=1"></script>
<script src="/games/audio.js?v=1"></script>
<script src="2048.js?v=2"></script>
</body>
</html>
